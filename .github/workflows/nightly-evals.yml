name: Nightly live evals

on:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-evals:
    name: RAG (EN + ES) and routing against the live agent
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SF_AUTH_URL: ${{ secrets.SF_AUTH_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when no org credential is configured
        id: gate
        run: |
          if [ -z "$SF_AUTH_URL" ]; then
            echo "::warning::SF_AUTH_URL secret is not set; skipping live evals."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Install Salesforce CLI and Python deps
        if: steps.gate.outputs.run == 'true'
        run: |
          npm install --global @salesforce/cli --no-audit --no-fund
          pip install pyyaml
      - name: Log in to the org (credential from the SF_AUTH_URL secret)
        id: login
        if: steps.gate.outputs.run == 'true'
        run: |
          if printf '%s' "$SF_AUTH_URL" | sf org login sfdx-url --sfdx-url-stdin - --alias ci-org --json > /dev/null; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not log in (the org may have expired); skipping live evals."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run live evals
        if: steps.login.outputs.ok == 'true'
        run: |
          mkdir -p nightly
          python scripts/rag_eval.py ci-org tests/rag-eval.yaml > nightly/rag-en.json
          python scripts/rag_eval.py ci-org tests/rag-eval-es.yaml > nightly/rag-es.json
          python scripts/routing_eval.py ci-org nightly > nightly/routing.json
      - name: Check thresholds
        if: steps.login.outputs.ok == 'true'
        run: python scripts/check_eval_thresholds.py --rag nightly/rag-en.json --rag-es nightly/rag-es.json --routing nightly/routing.json
      - uses: actions/upload-artifact@v4
        if: always() && steps.login.outputs.ok == 'true'
        with:
          name: nightly-evals
          path: nightly/
